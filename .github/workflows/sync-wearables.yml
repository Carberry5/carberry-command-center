name: Sync wearables

# Refreshes the WHOOP and Oura numbers on the member pages.
#
# Credentials live in public.oauth_tokens, seeded once with
# scripts/wearable-connect.ts. The only secrets this workflow needs are the
# Supabase service role key and — for WHOOP token refresh — the OAuth client
# credentials.
#
# Settings -> Secrets and variables -> Actions -> Secrets:
#   SUPABASE_SERVICE_ROLE_KEY   (already set for the feed sync)
#   WHOOP_CLIENT_ID
#   WHOOP_CLIENT_SECRET
#
# Oura needs nothing here: its personal access token is already in the database.

on:
  schedule:
    # Morning-ish, so the cards are current before anyone looks at them, and
    # again mid-afternoon. Both vendors publish a day's summary hours late, so
    # polling harder buys nothing.
    - cron: '25 11,20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report without writing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-wearables
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set."
            exit 1
          fi
          npx tsx scripts/sync-wearables.ts ${{ inputs.dry_run && '--dry-run' || '' }}
