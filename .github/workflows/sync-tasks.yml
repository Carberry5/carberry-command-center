name: Sync Google Tasks

# Keeps a Google Tasks list and the family's grocery list in step, both ways.
#
# The refresh token lives in public.oauth_tokens, put there once by
# scripts/google-connect.ts. This workflow only needs the Supabase service role
# key and the OAuth client credentials it takes to refresh that token.
#
# Settings -> Secrets and variables -> Actions -> Secrets:
#   SUPABASE_SERVICE_ROLE_KEY   (already set for the feed sync)
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#
# If this starts failing weekly with "refresh rejected", the OAuth client is
# still in Testing on the Google Auth Platform console — refresh tokens expire
# after 7 days there. Publish the app (unverified is fine for one family) and
# reconnect once.

on:
  schedule:
    # Every 20 minutes during waking hours. A grocery list is only useful if it
    # is current while somebody is standing in the shop; overnight it is not.
    # UTC, so 11-23 and 0-3 is roughly 7am to 11pm in Virginia. Written as two
    # ranges because cron cannot wrap midnight — '11-03' is simply invalid and
    # would never fire.
    - cron: '*/20 0-3,11-23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change without writing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never two at once: both would read the same list, and the second would
  # push a duplicate of whatever the first had just created.
  group: sync-tasks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set."
            exit 1
          fi
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are not set. See docs/google-tasks.md."
            exit 1
          fi
          npx tsx scripts/sync-tasks.ts ${{ inputs.dry_run && '--dry-run' || '' }}
